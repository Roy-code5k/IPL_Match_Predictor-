services:
  - type: web
    name: ipl-match-predictor-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: IPL_LOG_DIR
        value: /tmp/logs
      - key: CORS_ORIGINS
        value: "*"
